<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anime Run dashboard</title>
<style>
	body { font: 14px/1.45 system-ui, sans-serif; margin: 0; background: #111418; color: #e6e6e6; }
	header { padding: 12px 20px; background: #1b2028; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
	h1 { font-size: 18px; margin: 0; }
	h2 { font-size: 15px; margin: 0 0 8px; color: #9ecbff; }
	main { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; padding: 14px 20px; }
	section { background: #1b2028; border-radius: 8px; padding: 12px 14px; overflow: auto; max-height: 70vh; }
	pre { white-space: pre-wrap; margin: 0; font: 12px/1.4 ui-monospace, monospace; }
	table { border-collapse: collapse; width: 100%; font-size: 13px; }
	td, th { text-align: left; padding: 3px 6px; border-bottom: 1px solid #2a313c; vertical-align: top; }
	.pill { padding: 3px 10px; border-radius: 12px; font-weight: 600; }
	.green { background: #1f6f3f; } .red { background: #8b2a2a; } .stale { background: #8a6d1d; } .unknown { background: #444; }
	.muted { color: #8a94a3; }
</style>
</head>
<body>
<header>
	<h1>Anime Run</h1>
	<span id="gate" class="pill unknown">gate…</span>
	<span id="meta" class="muted"></span>
</header>
<main>
	<section><h2>Orchestration</h2><div id="orch"></div></section>
	<section><h2>Board</h2><pre id="board"></pre></section>
	<section><h2>Handoff</h2><pre id="handoff"></pre></section>
	<section><h2>Commits &amp; worktrees</h2><div id="git"></div></section>
	<section><h2>Owner questions</h2><pre id="owner"></pre></section>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const get = p => fetch(p).then(r => r.json());
const rows = (cols, list) => "<table><tr>" + cols.map(c => `<th>${esc(c)}</th>`).join("") + "</tr>" +
	list.map(r => "<tr>" + r.map(v => `<td>${esc(v)}</td>`).join("") + "</tr>").join("") + "</table>";

async function refresh() {
	const [m, g, o, b, h, q] = await Promise.all(["meta", "gate", "orchestrator", "board", "handoff", "owner"].map(n => get("/api/" + n)));
	const gate = document.getElementById("gate");
	gate.className = "pill " + g.verdict; gate.textContent = g.text;
	document.getElementById("meta").textContent = `${m.branch} @ ${m.head} · ${m.dirty.length} uncommitted · ${m.developer}`;
	let html = o.phase ? `<p>Phase <b>${esc(o.phase)}</b> · tick ${esc(o.tick)} · <span class="muted">${esc(o.updated)}</span>` +
		(o.context ? ` · context ${esc(o.context.pct)}%` : "") + "</p>" : "<p class='muted'>No .agents/orchestrator.json yet</p>";
	for (const goal of o.goals || []) {
		html += `<p><b>${esc(goal.id)}</b> ${esc(goal.title)} <span class="muted">(${esc(goal.status)}, ${esc(goal.branch)})</span></p>` +
			rows(["id", "output", "done when", "status"], goal.deliverables.map(d => [d.id, d.output, d.done_when, d.status]));
	}
	if ((o.tasks || []).length) html += "<h2 style='margin-top:12px'>Tasks</h2>" +
		rows(["id", "status", "branch", "tests", "audit", "studio"], o.tasks.map(t => [t.id, t.status, t.branch, t.tests, t.audit, t.resource]));
	if ((o.events || []).length) html += "<h2 style='margin-top:12px'>Events</h2>" +
		rows(["at", "kind", "task", "text"], o.events.slice(-15).reverse().map(e => [e.at, e.kind, e.task, e.text]));
	document.getElementById("orch").innerHTML = html;
	document.getElementById("board").textContent = b.text;
	document.getElementById("handoff").textContent = h.text;
	document.getElementById("owner").textContent = q.text || "None";
	document.getElementById("git").innerHTML = rows(["sha", "date", "author", "subject"], m.commits.map(c => [c.sha, c.date, c.author, c.subject])) +
		"<p></p>" + rows(["path", "head", "branch"], m.worktrees);
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
