<!DOCTYPE html><html><head><meta charset="utf-8"><title>Boss invite</title><link rel="stylesheet" href="kit.css">
<style>
/* Boss event Invite (BossEventUi "Invite": title, countdown plate, hint, Teleport / Decline; no close, Decline is the way out). Lacquer plate, no handscroll. */
.inv { position: absolute; left: 610px; top: 330px; width: 700px; height: 380px; border-radius: 8px; padding: 0 36px; background: linear-gradient(180deg, #3a3233, var(--lacquer-dark)); border: 3px solid var(--gold-soft); box-shadow: 0 0 0 6px #1a1213, 0 0 0 8px var(--gold-soft), 0 24px 40px #000a; color: var(--cream); }
.inv .band { position: absolute; left: -22px; top: 30px; height: 70px; padding: 0 40px 0 24px; display: flex; align-items: center; gap: 14px; background: var(--brush); border-radius: 4px 40px 4px 40px; box-shadow: 0 4px 0 var(--verm-deep); }
.inv .band img { width: 92px; margin: -30px 0 -10px -10px; filter: drop-shadow(0 3px 0 #0006); }
.inv .band span { font: 400 40px/1 var(--title); color: #fff3e0; letter-spacing: 1px; }
.inv .cd { position: absolute; right: 30px; top: 40px; height: 52px; padding: 0 22px; display: flex; align-items: center; gap: 10px; border-radius: 4px; border: 2px solid var(--gold); background: #0f0c0d; font: 900 32px var(--body); color: var(--gold); }
.inv .hint { position: absolute; left: 40px; right: 40px; top: 140px; font: 700 30px/1.3 var(--btn); color: var(--cream); }
.inv .row { position: absolute; left: 40px; right: 40px; bottom: 36px; display: flex; gap: 16px; }
.inv .row > * { flex: 1; height: 66px; font-size: 32px; }
.inv .pbtn { background: #f4ead2; }
.corner { position: absolute; width: 26px; height: 26px; border: 3px solid var(--gold); }
.c1 { left: 8px; top: 8px; border-right: 0; border-bottom: 0; } .c2 { right: 8px; top: 8px; border-left: 0; border-bottom: 0; }
.c3 { left: 8px; bottom: 8px; border-right: 0; border-top: 0; } .c4 { right: 8px; bottom: 8px; border-left: 0; border-top: 0; }
</style></head><body>
<div class="screen plaza"><div class="dim"></div><span class="label">Boss event Invite (players outside the event)</span>
<div class="inv">
 <i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
 <div class="band"><img src="../../hud_tabtilt/Boss.png"><span>BIG RAGA EVENT</span></div>
 <div class="cd"><span class="seal sm">時</span>0:24</div>
 <div class="hint">Teleport to fight Big Raga before the timer ends</div>
 <div class="row"><span class="tile go">Teleport</span><span class="pbtn">Decline</span></div>
</div>
</div>
<script src="kit.js"></script></body></html>
