<!DOCTYPE html><html><head><meta charset="utf-8"><title>Item menu</title><link rel="stylesheet" href="kit.css">
<style>
.pop { --roll:24px; }
.pop .hdr { left:30px; right:30px; top:10px; height:70px; gap:12px; }
.pop .hdr .icon { width:56px; height:56px; }
.pop .hdr .seal.big { width:52px; height:52px; font-size:30px; flex:none; }
.pop .wordmark { font-size:44px; }
.pop .kanji { font-size:22px; }
.pop .sub { font-size:18px; margin-bottom:10px; }
.pop .close { width:46px; height:46px; top:18px; right:40px; font-size:26px; }
.pop .hdr-rule { left:30px; right:30px; top:86px; }
.pop .pb { position:absolute; left:30px; right:30px; top:100px; bottom:22px; }

.dim2 { position:absolute; inset:0; background:rgba(0,0,0,.22); }
.mn { display:flex; gap:20px; }
.mn .card { width:190px; flex:none; }
.mn .card .art { height:190px; }
.mn .card .art img { height:184px; }
.mn .card .meta { justify-content:center; padding:6px 0; }
.mn .acts { flex:1; display:flex; flex-direction:column; gap:14px; justify-content:center; }
.mn .acts .tile, .mn .acts .pbtn { height:60px; font-size:28px; }
.note { margin-top:12px; text-align:center; font:700 18px var(--body); color:var(--verm); }
.q { font:600 26px/1.3 var(--body); text-align:center; color:var(--ink); margin:6px 0 18px; }
.q b { color:var(--r-rare); }
.q em { font-style:normal; color:var(--verm); font-weight:900; }
.step { display:flex; justify-content:center; align-items:center; gap:14px; margin-bottom:22px; }
.step .tile { min-width:0; width:58px; height:52px; padding:0; font-size:32px; }
.step .tile.max { width:auto; padding:0 18px; font-size:24px; }
.step .cnt { min-width:130px; height:52px; display:grid; place-items:center; font:900 28px var(--body); }
.yn { display:flex; justify-content:center; gap:24px; }
.yn > * { min-width:200px; height:62px; font-size:28px; }
</style></head><body>
<div class="screen plaza"><div class="dim"></div><span class="label">Item menu (Bag / Index: Sidekick or Relic) with the Sell confirm over it</span>
<div class="hs pop" style="left:250px;top:280px;width:640px;height:400px">
 <div class="paper"><div class="content">
  <div class="hdr"><img class="icon" src="../../hud_tabtilt/Items.png"><span class="wordmark">Gyokan</span><span class="kanji">操作</span></div>
  <div class="close">✕</div><div class="hdr-rule"></div>
  <div class="pb"><div class="mn"><div class="card r-Rare"><div class="art"><img src="../../../characters_avatar/side_dogs/portrait.png"></div><div class="strip"></div><div class="meta"><span class="rar">Rare</span></div></div><div class="acts"><span class="tile go">Equip</span><span class="pbtn red">Sell 5 Gems</span></div></div></div>
 </div></div>
 <div class="roller l"></div><div class="roller r"></div>
</div><div class="dim2"></div><div class="hs pop" style="left:840px;top:420px;width:760px;height:330px">
 <div class="paper"><div class="content">
  <div class="hdr"><span class="seal big">売</span><span class="wordmark">Sell</span><span class="kanji">売却</span></div>
  <div class="hdr-rule"></div>
  <div class="pb"><p class="q">Are you sure you want to sell <b>Gyokan</b> for <em>5 Gems</em>?</p><div class="step"><span class="tile">−</span><span class="lacq cnt">2 / 3</span><span class="tile">+</span><span class="tile max">Max</span></div><div class="yn"><span class="tile go">Sell</span><span class="pbtn">Cancel</span></div></div>
 </div></div>
 <div class="roller l"></div><div class="roller r"></div>
</div>
</div>
<script src="kit.js"></script></body></html>
