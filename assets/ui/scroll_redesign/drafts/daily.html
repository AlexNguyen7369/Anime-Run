<!DOCTYPE html><html><head><meta charset="utf-8"><title>Daily Rewards</title><link rel="stylesheet" href="kit.css">
<style>
/* Daily view of the Quests modal: days 1-6 in three columns of two rows, Day 7 the tall fourth column, CLAIM below. */
.body { top: 128px; display: flex; flex-direction: column; gap: 12px; }
.days { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; gap: 12px; }
.day { position: relative; display: flex; flex-direction: column; align-items: center; padding: 10px 12px; background: linear-gradient(180deg, var(--tile-top), var(--tile-bot)); border: 3px solid var(--tile-rim); border-radius: 6px; box-shadow: 0 4px 0 var(--tile-edge); }
.day .d { align-self: flex-start; font: 400 26px/1 var(--title); }
.day .art { flex: 1; display: grid; place-items: center; }
.day .rt { font: 700 17px var(--btn); color: var(--ink-soft); letter-spacing: .5px; }
.day.done { background: linear-gradient(180deg, #e3d8c2, #cfc0a2); border-color: #9a8a74; box-shadow: 0 4px 0 #6d604f; }
.day.done .d, .day.done .rt, .day.done .art { opacity: .5; }
.day.done .seal { position: absolute; right: 12px; top: 10px; width: 46px; height: 46px; font-size: 28px; opacity: 1; }
.day.today { border-color: var(--verm); box-shadow: 0 0 0 4px #fff8ee, 0 4px 0 var(--verm-deep); background: linear-gradient(180deg, #fff3dc, #f3d9a8); }
.day.today .now { position: absolute; right: 10px; top: 10px; }
.day.seven { grid-column: 4; grid-row: 1 / 3; background: linear-gradient(180deg, var(--burg-top), var(--burg-bot)); border-color: var(--pink); box-shadow: 0 5px 0 #26080f; color: var(--cream); }
.day.seven .d { align-self: center; color: var(--gold); font-size: 38px; }
.day.seven .rt { color: var(--gold); font-size: 22px; }
.bottle { position: relative; display: inline-block; width: 30px; height: 40px; transform: scale(2.1); }
.bottle::before { content: ""; position: absolute; left: 10px; top: 0; width: 10px; height: 10px; border-radius: 2px; background: #b07a46; border: 2px solid var(--ink); }
.bottle::after { content: ""; position: absolute; left: 2px; top: 9px; width: 22px; height: 27px; border-radius: 11px 11px 9px 9px; background: radial-gradient(circle at 35% 35%, #fff8 0 3px, transparent 4px), var(--bc); border: 2px solid var(--ink); }
.b-Luck { --bc: #b46bf0; } .b-Money { --bc: #f2c53d; } .b-Speed { --bc: #46b6f0; } .b-Stamina { --bc: #5cc98a; }
.claim { height: 54px; width: 100%; font-size: 28px; flex: none; }
</style></head><body>
<div class="screen plaza"><div class="dim"></div><span class="label">Daily Rewards - day 4 ready</span>
<div class="hs" style="left:300px;top:190px;width:1320px;height:700px">
 <div class="paper"><div class="content">
  <div class="hdr"><img class="icon" src="../../hud_tabtilt/Daily.png"><span class="wordmark">Daily Rewards</span><span class="kanji">日課</span><span class="sub">7 days</span></div>
  <div class="close">✕</div>
  <div class="hdr-rule"></div>
  <div class="body">
   <div class="days" id="d"></div>
   <span class="tile go claim">CLAIM DAY 4</span>
  </div>
  <div class="footer"><span class="seal sm">日</span><b>DAY 4 OF 7</b> · CLAIM TODAY'S REWARD!</div>
 </div></div>
 <div class="roller l"></div><div class="roller r"></div>
</div></div>
<script>
// DailyLoginConfig.Rewards; streak 3, today = Day 4
const R = [["Luck",1],["Money",1],["Stamina",1],["Money",1],["Speed",1],["Luck",2]];
document.getElementById("d").innerHTML = R.map(([b,n],i) => {
 const day = i + 1, done = day <= 3, today = day === 4;
 return `<div class="day ${done?"done":""} ${today?"today":""}"><span class="d">DAY ${day}</span>${done?'<span class="seal">済</span>':""}
 <div class="art"><span class="bottle b-${b}"></span></div><span class="rt">x${n} ${b.toUpperCase()} POTION</span></div>`;
}).join("") + `<div class="day seven"><span class="d">DAY 7</span><div class="art"><img src="../../hud_tabtilt/Rebirth.png" style="width:150px"></div><span class="rt">GUARANTEED RARE</span></div>`;
</script>
<script src="kit.js"></script></body></html>
