<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bosses</title><link rel="stylesheet" href="kit.css">
<style>
/* Bosses panel (BossEventUi BossesPanel, BOSS_EVENT_SPEC "Bosses cards" draft B): large card = live/next boss, right strip = the others dimmed, SpawnBox under them. */
.bz { position: absolute; left: 40px; right: 40px; top: 132px; bottom: 26px; display: grid; grid-template-columns: 64fr 36fr; gap: 14px; }
.big { position: relative; padding: 14px 16px; }
.big .top { display: flex; justify-content: space-between; align-items: center; }
.live { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 20px; border-radius: 20px 6px 20px 6px; background: var(--brush); color: #fff3e0; font: 400 24px/1 var(--title); letter-spacing: 1px; box-shadow: 0 3px 0 var(--verm-deep); }
.live i { width: 11px; height: 11px; border-radius: 50%; background: #fff3e0; }
.big .nm { font: 400 50px/1 var(--title); margin: 14px 0 2px; }
.ph { display: inline-flex; align-items: center; gap: 8px; font: 700 22px var(--btn); color: var(--ink-soft); }
.big .portrait { position: absolute; left: 16px; bottom: 14px; top: 182px; width: calc(55% - 16px); border: 2px solid var(--tile-rim); border-radius: 6px; background: radial-gradient(circle at 50% 70%, #fbe1e8, #f2c3cf 60%, #e7aebd); display: grid; place-items: end center; overflow: hidden; }
.big .portrait img { width: 100%; height: 100%; object-fit: contain; }
.right { position: absolute; left: 55%; right: 16px; top: 66px; bottom: 14px; display: flex; flex-direction: column; gap: 12px; }
.timer { position: relative; height: 44px; border-radius: 4px; overflow: hidden; display: grid; place-items: center; font: 700 24px var(--btn); }
.timer > i { position: absolute; left: 0; top: 0; bottom: 0; width: 62%; background: linear-gradient(90deg, var(--verm-deep), var(--verm)); }
.timer span { position: relative; color: var(--cream); }
.right .tile.go { height: 64px; font-size: 34px; }
.rhead { display: flex; align-items: center; gap: 10px; font: 400 26px/1 var(--title); }
.rhead::after { content: ""; flex: 1; height: 2px; background: var(--ink-soft); opacity: .4; }
.rw { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1; }
.rt { position: relative; background: linear-gradient(180deg, var(--tile-top), var(--tile-bot)); border: 3px solid var(--tile-rim); border-radius: 6px; box-shadow: 0 3px 0 var(--tile-edge); display: grid; place-items: center; }
.rt img { height: 84px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
.rt .cash { font: 900 54px/1 var(--body); color: #2f9a45; -webkit-text-stroke: 2px var(--ink); }
.rt b { position: absolute; right: 8px; bottom: 4px; font: 700 21px var(--btn); color: var(--ink); }
.side { display: flex; flex-direction: column; gap: 14px; }
.sm { position: relative; flex: 1; min-height: 0; display: flex; gap: 14px; padding: 10px 14px; align-items: center; }
.sm .pt { width: 104px; height: 104px; flex: none; border: 2px solid var(--tile-rim); border-radius: 6px; background: linear-gradient(180deg, #e9dcc0, #d7c49e); display: grid; place-items: end center; overflow: hidden; }
.sm .pt img { width: 104px; height: 104px; object-fit: contain; }
.sm .info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.sm .nm2 { font: 400 28px/1 var(--title); }
.sm .not { align-self: flex-start; margin-top: 4px; padding: 4px 16px; border-radius: 16px 4px 16px 4px; background: var(--lacquer); color: var(--cream); border: 1.5px solid var(--gold-soft); font: 700 19px var(--btn); position: relative; z-index: 3; }
.sm .det { position: absolute; right: 12px; bottom: 10px; height: 34px; font-size: 18px; padding: 0 14px; z-index: 3; }
.sm .veil { position: absolute; inset: 0; background: rgba(46, 30, 22, .38); border-radius: 4px; z-index: 2; }
.spawn { flex: 1.3; padding: 16px 18px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; background: repeating-linear-gradient(90deg, rgba(120,90,50,.04) 0 2px, transparent 2px 7px), linear-gradient(180deg, #ece0c4, #ddcca6); }
.spawn .note { font: 700 23px/1.25 var(--btn); color: var(--ink-soft); }
.spawn .busy { margin-top: auto; font: 600 18px var(--body); color: var(--muted); }
.spawn .tile { flex: none; width: 100%; height: 56px; font-size: 28px; filter: grayscale(.85) brightness(.92); opacity: .75; }
</style></head><body>
<div class="screen plaza"><div class="dim"></div><span class="label">Bosses - Big Raga live, the others dimmed</span>
<div class="hs" style="left:300px;top:190px;width:1320px;height:700px">
 <div class="paper"><div class="content">
  <div class="hdr"><img class="icon" src="../../hud_tabtilt/Boss.png"><span class="wordmark">Bosses</span><span class="kanji">討伐</span></div>
  <div class="close">✕</div>
  <div class="hdr-rule"></div>
  <div class="bz">
   <div class="card big">
    <div class="top"><span class="live"><i></i>LIVE</span><span class="pbtn">Details</span></div>
    <div class="nm">Big Raga</div>
    <div class="ph">2 phases</div>
    <div class="portrait"><img src="../../../characters_avatar/side_raga/portrait.png"></div>
    <div class="right">
     <div class="timer lacq"><i></i><span>5:12 left</span></div>
     <div class="tile go">Go</div>
     <div class="rhead">Rewards</div>
     <div class="rw">
      <div class="rt"><img src="../../chest_raga.png"><b>1x</b></div>
      <div class="rt"><span class="cash">$</span><b>100K</b></div>
      <div class="rt"><img src="../../chest_adapted.png"><b>1x</b></div>
      <div class="rt"><img src="../../gem.png"><b>1K</b></div>
     </div>
    </div>
   </div>
   <div class="side">
    <div class="card sm"><div class="pt"><img src="../../../characters_avatar/boss_mage/portrait.png"></div>
     <div class="info"><span class="nm2">The Elf Mage</span><span class="ph" style="font-size:19px">1 phase</span><span class="not">Not this time</span></div>
     <div class="veil"></div><span class="pbtn det">Details</span></div>
    <div class="card sm"><div class="pt"><img src="../../../characters_avatar/boss_king/portrait.png"></div>
     <div class="info"><span class="nm2">The Golden King</span><span class="ph" style="font-size:19px">1 phase</span><span class="not">Not this time</span></div>
     <div class="veil"></div><span class="pbtn det">Details</span></div>
    <div class="card spawn">
     <span class="seal">鬼</span>
     <div class="note">Each event picks<br>one boss at random</div>
     <div class="busy">Not during an event</div>
     <div class="tile">Spawn boss</div>
    </div>
   </div>
  </div>
 </div></div>
 <div class="roller l"></div><div class="roller r"></div>
</div></div>
<script src="kit.js"></script></body></html>
